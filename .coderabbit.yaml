# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# THE CANONICAL CODERABBIT BASELINE — every repo in the estate, both owners.
#
# This file is the SINGLE SOURCE OF TRUTH, and it has exactly two consumers:
#   * `scripts/apply-repo-baseline.py`  WRITES this content into a repo that has no config.
#   * `scripts/check-repo-baseline.py`  ASSERTS the values below are what each repo carries.
#
# Two copies of a rule are two rules, so neither script restates the values — they read them
# from here. Change a baseline value HERE and both the writer and the detector move together.
#
# WHAT THE DETECTOR ACTUALLY ASSERTS, AND WHY IT IS NOT BYTE EQUALITY
# -------------------------------------------------------------------
# Repos legitimately differ: msm-infra carries `path_instructions` about Terraform and IAM
# that would be noise in `daily-wallpaper`. Demanding byte equality would either erase that
# guidance or force it everywhere, and a detector whose green requires deleting real value
# gets switched off. So the file splits in two:
#
#   * THE BASELINE BLOCK (everything below marked `# BASELINE:`) — identical everywhere,
#     and the only thing check-repo-baseline.py asserts.
#   * REPO-SPECIFIC GUIDANCE (`path_instructions`, prose about what the repo is) — absent
#     here on purpose. A repo that has it keeps it; a new repo starts without it.
#
# WHY THIS FILE EXISTS AT ALL — the incident, banked so it is not re-derived
# --------------------------------------------------------------------------
# `msm-clickup-broker` was created 2026-08-24 at ~00:00 CDT and shipped a PR the same night
# with no `.coderabbit.yaml`. CodeRabbit therefore auto-reviewed every push: three billed
# reviews on one PR in one night, contributing to the org hitting its usage spending cap by
# morning. The cap then blocked the review that was actually needed on msm-infra#50 and left
# a GREEN CodeRabbit check sitting over a review that never ran.
#
# The conventions were all written down. The repo was created by an agent that had read them.
# That is the point: REMEMBERING IS NOT A MECHANISM. The rule "CodeRabbit is the last
# reviewer, never the first" lived in prose and in a PreToolUse hook on Bash — while the
# behaviour was decided by a YAML file nobody re-read. A hook cannot catch a missing file,
# because an absence emits no event.
#
# TRAPS, banked from the same incident
# -------------------------------------
#   * A COST DECISION HERE IS ALSO AN APPROVAL DECISION. On a repo with
#     `required_approving_review_count: 1` and one human member, CodeRabbit is the only
#     principal that can satisfy the gate. Never reason about the review budget without
#     checking branch protection first — the first version of this file did exactly that.
#   * CodeRabbit reads `.coderabbit.yaml` from the PR's HEAD BRANCH, not the default branch.
#     An open PR keeps the old behaviour until it carries this change. A sweep that reads
#     only default branches reports a repo fixed while its in-flight PRs still auto-review —
#     which is why check-repo-baseline.py also walks open PR heads.
#   * `inheritance` DEFAULTS TO FALSE and the chain stops at the first level where it is
#     false or unset, so a repo-level `true` alone does not pull org values down. Adding a
#     repo YAML also promotes it to priority 2, ABOVE the Organization UI (priority 5), so
#     unset keys silently collapse to schema defaults. That is why every value below is set
#     explicitly rather than left to the dashboard.
#   * `@coderabbitai review` is INCREMENTAL-ONLY. With auto-review off there is never a
#     prior review to be incremental against, and a bare `review` has been observed
#     answering "no files to review" in a reply that reads affirmative. Ask for
#     `@coderabbitai full review`, alone in its own comment.
#
# Provenance: adopted estate-wide from the msm-infra config reasoned out on PR #51
# (`chore/coderabbit-on-demand`). Tracker: msm-infra#52.

# ═══════════════════════════════════════════════════════════════════════════════════════
# MSM CODERABBIT BASELINE — REGION 1 of 2. DO NOT EDIT BETWEEN THE MARKERS.
#
# Everything between this line and END REGION 1 is IDENTICAL IN EVERY REPOSITORY in the
# estate, byte for byte, and `scripts/check-repo-baseline.py` asserts exactly that. Edit it
# in ONE place — `scripts/coderabbit-baseline.yaml` in Main-Street-Mentor/msm-infra — and
# `scripts/apply-repo-baseline.py` propagates it everywhere.
#
# WHY THE BLOCK IS ASSERTED AND NOT JUST THE VALUES. On 2026-08-24 the baseline's
# `auto_review.enabled` was corrected from false to true. The writer patches VALUES and not
# prose, deliberately, so repo-specific guidance survives — and fourteen repositories ended
# up holding the RIGHT value under a comment block still arguing for the WRONG one. The
# sweep could not see it, because it asserted values and not reasoning. A config whose
# comments contradict its own setting is the exact defect this estate exists to remove, so
# the reasoning is now part of what gets enforced.
#
# WHAT IS *NOT* IN HERE, on purpose: `path_instructions` and `path_filters`. Those are
# written for a specific codebase and belong to it — they live BETWEEN the two regions and
# nothing here touches them. Uniformity where uniformity is correct; local knowledge kept
# local.
# ═══════════════════════════════════════════════════════════════════════════════════════
language: en-US

# BASELINE: inheritance
#
# Explicit because the default is false and the chain stops at the first level that does not
# set it. See the trap above — a repo-level YAML also outranks the Organization UI, so
# nothing here may rely on a dashboard value.
inheritance: true

reviews:
  # BASELINE: profile
  #
  # Set EXPLICITLY. `profile` defaults to `chill`, and relying on the dashboard failed
  # silently once already: on 2026-08-10 every repo in the estate measured CHILL while
  # reading as configured.
  profile: assertive

  # BASELINE: request_changes_workflow
  #
  # Without this CodeRabbit can only COMMENT, never APPROVE — and a repo whose branch
  # protection requires one approving review then has no satisfiable path except an admin
  # override, which is a control that trains you to bypass it.
  request_changes_workflow: true

  # BASELINE: review_status
  #
  # Announces a SKIPPED review. A silently skipped review is indistinguishable from a clean
  # one, which is the exact failure class this whole baseline exists to detect.
  review_status: true

  # BASELINE: auto_review.enabled + auto_review.auto_incremental_review
  #
  # ONE REVIEW AT OPEN, NONE ON SUBSEQUENT PUSHES.
  #
  # THE FIRST VERSION OF THIS BASELINE SET `enabled: false` AND WAS WRONG. Recording why,
  # because the reasoning that produced it was sound and still reached the wrong answer.
  #
  # The cost analysis was right: CodeRabbit bills per review, and msm-clickup-broker#1 drew
  # three billed reviews in one night on the way to the org hitting its spending cap. But the
  # three were ONE AT OPEN PLUS TWO FROM FIX PUSHES. The burn is incremental review. The
  # review at open is the one that pays for itself, and turning it off does not save a third
  # of the cost — it costs the approval.
  #
  # MEASURED ON THIS ESTATE 2026-08-24, not assumed:
  #   * 8 of 10 repos run `required_approving_review_count: 1` with `dismiss_stale_reviews`.
  #   * The org has ONE human member, and GitHub does not let a PR author approve their own PR.
  #   * Across the last 25 merged msm-infra PRs, EVERY approving review came from
  #     coderabbitai[bot] — 7 of them, and zero from a human. CodeRabbit is not merely a
  #     reviewer here; it is the only principal that can satisfy the gate.
  #
  # So `enabled: false` on a protected repo leaves exactly two ways to merge: request a review
  # by hand on every head, or use the `enforce_admins: false` bypass. The second is what
  # terraform/github/branch_protection.tf calls "the most load-bearing comment in this root",
  # precisely because it must not become routine — and the same measurement shows 18 of those
  # 25 PRs already merged with no approving review at all, so it is ALREADY closer to routine
  # than anyone intended. A baseline that pushes it further is the wrong trade.
  #
  # `auto_incremental_review: false` is where the saving actually lives, and it is kept.
  #
  # The house rule stands unchanged: free reviewers (Codex, /code-review) see every head
  # BEFORE CodeRabbit, which confirms. What changed is the mechanism — the one review at open
  # is the confirmation, not a first pass, and pushing fixes after it costs nothing.
  # Re-request explicitly with `@coderabbitai full review` when a head has moved materially.
  auto_review:
    enabled: true
    auto_incremental_review: false

    # BASELINE: auto_review.drafts
    #
    # THIS KEY IS WHAT MAKES `enabled: true` COMPATIBLE WITH THE HOUSE RULE, and it is the
    # piece the first two versions of this baseline both missed.
    #
    # The rule is "CodeRabbit is the last reviewer, never the first": free reviewers (Codex,
    # /code-review) see every head BEFORE the paid one confirms. But `enabled: true` reviews
    # a PR THE MOMENT IT OPENS, which makes CodeRabbit the FIRST reviewer again — the exact
    # thing the rule forbids. The two requirements look irreconcilable: the review at open is
    # also the only thing that can approve a PR on a protected repo.
    #
    # Drafts resolve it. With this false, a DRAFT PR is not auto-reviewed. So:
    #
    #     1. Open the PR AS A DRAFT.
    #     2. Free reviewers see the head — Codex, /code-review, /security-review.
    #     3. Mark it ready for review.
    #     4. CodeRabbit reviews ONCE, on a head the free reviewers have already been over,
    #        and that single review is also the approving review the branch protection needs.
    #
    # One billed review per PR, spent LAST, and it satisfies the approval gate. That is both
    # constraints met rather than one traded against the other.
    #
    # Set explicitly even though false is the schema default, for the same reason `profile`
    # is: this file outranks the Organization UI, and a default that the whole workflow
    # depends on should not be inherited silently.
    drafts: false

    # BASELINE: auto_pause_after_reviewed_commits
    #
    # Asserted like every other value here. It was exempt for a while, because two repos
    # had reasoned to opposite values in their own comments and forcing one would have left
    # the other arguing against its own setting — a concern the canonical regions remove,
    # since the comment and the value now travel together from this file.
    #
    # It is inert either way: with `auto_incremental_review: false` above, no incremental
    # review ever starts, so there is nothing to pause. The value below is the one to hold
    # if that ever changes.
    #
    # LOW, not 0. The counter is per-PR while the review allowance is per-DEVELOPER and
    # shared across every open PR, so a per-PR bound does not bound aggregate use.
    #
    # THE RESUME STEP IS NOT OPTIONAL, and this bit us on msm-skills#69 on 2026-08-11. Once
    # paused, later pushes do NOT re-review — so if the last review was `CHANGES_REQUESTED`,
    # the PR stays blocked no matter what you push, because the blocking review is never
    # superseded. Comment `@coderabbitai review` to resume (or `full review` when the only
    # change was to this file, since an incremental review answers "no files to review" and
    # never runs). Each costs one of the hourly allowance.
    auto_pause_after_reviewed_commits: 2

  # Walkthrough content nobody reads, all default ON and all costing review time.
  # `review_status` is KEPT above deliberately — it is the signal that a review was skipped.
  sequence_diagrams: false
  changed_files_summary: false
  related_issues: false # issues live in ClickUp, not GitHub
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false # solo operator
  estimate_code_review_effort: false
  assess_linked_issues: false

  # No `tools:` block on purpose — every analyzer defaults to enabled. Hand-classifying which
  # ones "apply" is how msm-skills once disabled the security scanner for the file type it
  # holds most of.

# ═══════════════════════════════════════════════════════════════════════════════════════
# END MSM CODERABBIT BASELINE REGION 1
#
# Below, and until REGION 2 begins, is this repository's OWN review guidance — the
# `path_instructions` and `path_filters` written for this codebase. Add to it freely; the
# baseline sweep does not police it, and the writer never rewrites it.
#
# It has to sit here rather than after REGION 2 because `path_instructions` is nested under
# `reviews:`, and YAML permits a mapping key exactly once — so the baseline cannot be one
# contiguous run without either swallowing this guidance or splitting the `reviews:` block.
# Two regions is the honest shape of that constraint rather than a workaround for it.
# ═══════════════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════════════
# MSM CODERABBIT BASELINE — REGION 2 of 2. DO NOT EDIT BETWEEN THE MARKERS.
# ═══════════════════════════════════════════════════════════════════════════════════════
# BASELINE: knowledge_base.{learnings,issues,pull_requests}.scope
#
# All three pinned to `local`. The default is `auto`, which resolves to GLOBAL context on
# PRIVATE repositories — and most of this estate is private. `auto` would widen the review
# context beyond the repo by default, which is a data-boundary decision made by a default.
knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
# ═══════════════════════════════════════════════════════════════════════════════════════
# END MSM CODERABBIT BASELINE REGION 2
# ═══════════════════════════════════════════════════════════════════════════════════════
